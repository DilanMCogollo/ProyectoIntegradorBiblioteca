<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Biblioteca I.U Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">
    <header class="bg-[#003B73] text-white shadow-lg p-6">
        <h1 class="text-3xl font-bold text-center">Contactanos</h1>
    </header>
    <nav class="bg-[#D62828] p-4 flex justify-center gap-6 flex-wrap">
        <a href="index.html"  class="text-white hover:text-yellow-300 font-semibold">Inicio</a> 
        <a href="catalogo.html"  class="text-white hover:text-yellow-300 font-semibold">Catálogo</a> 
        <a href="reservas.html"  class="text-white hover:text-yellow-300 font-semibold">Reservas</a> 
        <a href="nosotros.html"  class="text-white hover:text-yellow-300 font-semibold">Nosotros</a> 
        <a href="contacto.html" class="text-white hover:text-yellow-300 font-semibold">Contacto</a>
    </nav>
    <main class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md">
        <p class="text-gray-700 mb-3">Nos puedes contactar por los siguientes medios: </p>
        <p class="text-gray-700 mb-2">Correo: atencionalciudadano@iudigital.edu.co</p>
        <p class="text-gray-700 mb-6">Teléfono: (+57) 604 520 07 50</p>
        <p  class="text-gray-700 mb-2">O por el siguiente formulario</p>
        <h2 class="text 2xl font-bold text-[#003B73] mb-6">Formulario de contacto</h2>
        <form id="formContacto" class="space-y-5">
            <div>
                <label class="block mb-2 font-semibold">Nombre:</label>
                <input id="nombre" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-[#003B73]" type="text">
            </div>
            <div>
                <label class="block mb-2 font-semibold">Correo:</label>
                <input id="correo" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-[#003B73]" type="text">
            </div>
            <div >
                 <label class="block mb-2 font-semibold">Mensaje</label>
                 <textarea id="mensajeTexto" rows="5" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-[#003B73]"></textarea>
            </div>
           
            <button class="bg-[#D62828] hover:bg-red-700 text-white px-6 py-3 rounded-lg font-semibold" type="submit">Enviar</button>
            <p id="mensaje" class="font-semibold mt-4"></p>
        </form>
    </main>
    <footer class="bg-[#003B73] text-white text-center p-4 mt-10">
        <p>Biblioteca I.U Digital de antioquia - 2026</p>
    </footer>
    <script src="./js/contacto.js"></script>
</body>

</html>
